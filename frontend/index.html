<!DOCTYPE html>
<html>
<head>
  <title>UJAP Field Data Viewer</title>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([32.3252, 36.3678], 18);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics'
    }).addTo(map);

    L.tileLayer('http://127.0.0.1:8000/tiles/{z}/{x}/{y}.jpg', {
      maxZoom: 21,
      attribution: 'UJAP 2014 Orthophoto by Ivan LaBianca'
    }).addTo(map);

    fetch('http://127.0.0.1:8000/layers/areas')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            layer.bindPopup(`<b>${p.v_displayname}</b><br>${p.description ?? ''}`);
          }
        }).addTo(map);
      })
      .catch(err => console.error('Failed to load layer:', err));

      fetch('http://127.0.0.1:8000/layers/buildings')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            layer.bindPopup(`<b>${p.name}</b><br>${p.building_type_id}<br>${p.description ?? ''}`);
          }
        }).addTo(map);
      })
      .catch(err => console.error('Failed to load layer:', err));

    fetch('http://127.0.0.1:8000/layers/contexts')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: (feature, layer) => {
            const p = feature.properties;
            layer.bindPopup(`<b>${p.context_code}</b><br>${p.name}<br>${p.description ?? ''}`);
          }
        }).addTo(map);
      })
      .catch(err => console.error('Failed to load layer:', err));
  </script>
</body>
</html>
